name: Aviso push a develop (Backend)

on:
  push:
    branches: [develop]

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - name: Avisar a Teams
        env:
          WEBHOOK: ${{ secrets.TEAMS_WEBHOOK_URL }}
          ACTOR: ${{ github.actor }}
          MSG: ${{ github.event.head_commit.message }}
          REPO: ${{ github.repository }}
          URL: ${{ github.event.head_commit.url }}
          COMPARE: ${{ github.event.compare }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "Error: El secreto TEAMS_WEBHOOK_URL no está configurado."
            exit 1
          fi

          jq -n \
            --arg actor "$ACTOR" \
            --arg msg "$MSG" \
            --arg repo "$REPO" \
            --arg url "$URL" \
            --arg compare "$COMPARE" '{
              type: "message",
              attachments: [{
                contentType: "application/vnd.microsoft.card.adaptive",
                content: {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  type: "AdaptiveCard",
                  version: "1.4",
                  msteams: { width: "Full" },
                  body: [
                    {
                      type: "Container",
                      style: "good",
                      bleed: true,
                      items: [
                        {
                          type: "ColumnSet",
                          columns: [
                            {
                              type: "Column",
                              width: "auto",
                              verticalContentAlignment: "Center",
                              items: [
                                {
                                  type: "Image",
                                  url: "https://raw.githubusercontent.com/devicons/devicon/master/icons/spring/spring-original.svg",
                                  size: "Small",
                                  style: "Person"
                                }
                              ]
                            },
                            {
                              type: "Column",
                              width: "stretch",
                              verticalContentAlignment: "Center",
                              items: [
                                { type: "TextBlock", text: "BACKEND · Actualización en develop", weight: "Bolder", size: "Large", color: "Good", wrap: true },
                                { type: "TextBlock", text: ("Por " + $actor + " · " + $repo), isSubtle: true, spacing: "None", wrap: true }
                              ]
                            }
                          ]
                        }
                      ]
                    },
                    {
                      type: "Container",
                      style: "emphasis",
                      spacing: "Medium",
                      items: [
                        { type: "TextBlock", text: "Último commit", size: "Small", isSubtle: true, weight: "Bolder" },
                        { type: "TextBlock", text: $msg, wrap: true, spacing: "Small" }
                      ]
                    },
                    {
                      type: "Container",
                      style: "warning",
                      spacing: "Medium",
                      items: [
                        { type: "TextBlock", text: "Recuerda ejecutar git pull origin develop antes de subir cambios.", weight: "Bolder", wrap: true }
                      ]
                    }
                  ],
                  actions: [
                    { type: "Action.OpenUrl", title: "Ver commit", url: $url },
                    { type: "Action.OpenUrl", title: "Ver cambios (Diff)", url: $compare }
                  ]
                }
              }]
            }' | curl -sS -f -X POST "$WEBHOOK" \
                 -H "Content-Type: application/json" \
                 -d @-