spring.application.name=generation
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

#puerto de la aplicacion
server.port=${PORT:9098}

# Base de datos (MySQL)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true&sslMode=REQUIRED&serverTimezone=UTC

spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.mail.host=live.smtp.mailtrap.io
spring.mail.port=587
spring.mail.username=api
spring.mail.password=${MAILTRAP_API_TOKEN}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.data.web.pageable.max-page-size=50


app.mail.from=no-reply@tutaller-notificaciones.narcirismena.com
app.mail.from-name=Tu Taller

#cors
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# JWT

jwt.secret=${JWT_SECRET_KEY}S
jwt.expiration-ms=3600000

#cloudinary

cloudinary.cloud-name=tutaller
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_SECRET}