<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cita confirmada</title>
</head>
<body style="margin:0; padding:0; background-color:#eaf1ff; font-family:'Manrope', Arial, Helvetica, sans-serif; color:#0b1b3a;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#eaf1ff" style="background-color:#eaf1ff; padding:28px 12px;">
    <tr>
        <td align="center">

            <!-- Marca -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:580px;">
                <tr>
                    <td align="center" style="padding:0 0 16px 0;">
                        <span style="font-size:20px; font-weight:800; color:#0b1b3a;">Tu</span><span style="font-size:20px; font-weight:800; color:#4f35ff;">Taller</span>
                    </td>
                </tr>
            </table>

            <!-- Tarjeta principal -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:580px; background-color:#ffffff; border-radius:20px; overflow:hidden; border:1px solid #e3e8f5;">

                <!-- Bloque violeta -->
                <tr>
                    <td align="center" bgcolor="#4f35ff" style="background-color:#4f35ff; padding:36px 28px 32px 28px;">
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center">
                            <tr>
                                <td align="center" width="56" height="56" bgcolor="#ff6a2b" style="background-color:#ff6a2b; border-radius:28px; width:56px; height:56px; font-size:28px; line-height:56px; font-weight:bold; color:#ffffff;">
                                    &#10003;
                                </td>
                            </tr>
                        </table>
                        <h1 style="margin:18px 0 6px 0; font-size:28px; line-height:1.2; font-weight:800; color:#ffffff;">
                            Cita confirmada
                        </h1>
                        <p style="margin:0; font-size:16px; line-height:1.5; color:#dfe6ff;">
                            Hola, <span th:text="${name}">Cliente</span>. Tu vehículo está en buenas manos.
                        </p>
                    </td>
                </tr>

                <!-- Detalle -->
                <tr>
                    <td style="padding:28px 28px 8px 28px;">
                        <p style="margin:0 0 12px 0; font-size:12px; text-transform:uppercase; letter-spacing:1.2px; font-weight:bold; color:#6b7694;">
                            Detalle de tu cita
                        </p>

                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f3f6fc; border:1px solid #e3e8f5; border-radius:12px;">
                            <tr>
                                <td style="padding:16px 20px; border-bottom:1px solid #e3e8f5;">
                                    <p style="margin:0 0 3px 0; font-size:12px; color:#6b7694;">Taller</p>
                                    <p style="margin:0; font-size:18px; font-weight:800; color:#0b1b3a;" th:text="${workshop}">el taller</p>
                                </td>
                            </tr>
                            <tr>
                                <td style="padding:16px 20px;">
                                    <p style="margin:0 0 3px 0; font-size:12px; color:#6b7694;">Fecha</p>
                                    <p style="margin:0; font-size:18px; font-weight:800; color:#ff6a2b;" th:text="${date}">fecha</p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- Nota -->
                <tr>
                    <td style="padding:20px 28px 32px 28px;">
                        <p style="margin:0; font-size:14px; line-height:1.7; color:#6b7694;">
                            Si necesitas cambiarla, responde a este correo y con gusto te ayudamos.
                        </p>
                    </td>
                </tr>

                <!-- Pie -->
                <tr>
                    <td align="center" bgcolor="#f3f6fc" style="background-color:#f3f6fc; border-top:1px solid #e3e8f5; padding:18px 28px;">
                        <p style="margin:0; font-size:12px; line-height:1.6; color:#6b7694;">
                            Equipo Tu Taller
                        </p>
                    </td>
                </tr>

            </table>

            <!-- Nota al pie -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:580px;">
                <tr>
                    <td align="center" style="padding:16px 12px 0 12px;">
                        <p style="margin:0; font-size:12px; color:#6b7694;">
                            Recibiste este correo porque agendaste una cita en TuTaller.
                        </p>
                    </td>
                </tr>
            </table>

        </td>
    </tr>
</table>

</body>
</html>
